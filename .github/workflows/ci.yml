name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install CPU-only torch wheels (keeps CI fast)
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        # torch is already satisfied above, so this only pulls the rest.
        run: pip install -r requirements.txt flake8

      - name: Lint (flake8)
        run: flake8 .

      - name: Test (pytest)
        run: pytest -q
